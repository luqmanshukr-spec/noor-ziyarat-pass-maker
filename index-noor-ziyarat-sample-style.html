<style>
*{box-sizing:border-box}
body{margin:0;background:#07171b;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif}
.wrap{max-width:1240px;margin:auto;padding:16px}
h1{text-align:center;color:#d7ab52;margin:3px 0 5px;font-size:28px}
.sub{text-align:center;color:#b9c5c8;margin:0 0 16px}
.app{display:grid;grid-template-columns:350px 1fr;gap:18px;align-items:start}
.panel{background:#10252b;border:1px solid #38545c;border-radius:18px;padding:17px}
.panel h2{margin:0 0 12px;color:#d7ab52}
label{display:block;margin:9px 0 5px;font-weight:800}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #4d656d;background:#07171b;color:#fff;font-size:16px}
.file{padding:7px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
button{border:0;border-radius:10px;padding:12px;font-weight:900;font-size:16px;background:#d7ab52;color:#07171b;cursor:pointer}
button.secondary{background:#294047;color:#fff}
.note{font-size:12px;color:#9eb0b5;line-height:1.7}
.stage{width:100%;background:#d8d2c7;border-radius:18px;padding:14px;overflow:hidden}
.card{position:relative;width:100%;aspect-ratio:3/2;background-size:100% 100%;background-position:center;background-repeat:no-repeat;border-radius:25px;overflow:hidden;box-shadow:0 18px 40px #0008}
/* dynamic areas placed on the same coordinates as the supplied sample */
.photoMask{position:absolute;left:4.3%;top:32%;width:23.7%;height:47%;border-radius:19px;overflow:hidden;background:#f8f4ea}
.photoMask img{width:100%;height:100%;object-fit:cover}
.photoPlaceholder{height:100%;display:flex;align-items:center;justify-content:center;color:#9aa0a2;font-size:clamp(55px,8vw,110px)}
.logoMask{position:absolute;left:4.4%;top:2.4%;width:17.2%;height:27%;border-radius:50%;overflow:hidden;background:#f8f4ea}
.logoMask img{width:100%;height:100%;object-fit:contain}
.logoPh{height:100%;display:flex;align-items:center;justify-content:center;color:#8f6d2e;font-size:24px;font-weight:900}
.flagMask{position:absolute;right:4.2%;top:7.1%;width:14%;height:14.5%;border-radius:8px;overflow:hidden;background:#fff}
.flagMask img{width:100%;height:100%;object-fit:cover}
.flagPh{height:100%;display:flex;align-items:center;justify-content:center;color:#063c32;font-weight:900}
.qrMask{position:absolute;right:4.4%;top:20.5%;width:17.2%;height:24.5%;background:#fff;overflow:hidden}
.qrMask img{width:100%;height:100%;object-fit:contain}
.field{position:absolute;right:20.5%;width:49%;height:8%;display:flex;align-items:center;justify-content:flex-start;direction:rtl;background:#f9f5eb;padding-right:2%;font-size:clamp(15px,2vw,30px);font-weight:900;color:#111820;white-space:nowrap;overflow:hidden}
.f1{top:29.5%}.f2{top:39.5%}.f3{top:50%}.f4{top:61.2%}.f5{top:72.4%}
.labelCover{position:absolute;right:35%;width:17%;height:8%;background:#f9f5eb}
.c1{top:29.5%}.c2{top:39.5%}.c3{top:50%}.c4{top:61.2%}.c5{top:72.4%}
@media(max-width:900px){.app{grid-template-columns:1fr}}
</style>

<div class="wrap">
<h1>باجی عومرە — کۆمپانیای نوری زیارەت</h1>
<p class="sub">دیزاینەکە وەک نموونەکەی تۆیە و زانیارییەکان پێش دابەزاندن دەبینرێن</p>

<div class="app">
<section class="panel">
<h2>زانیاری باج</h2>
<label>ناو / اسم</label><input id="name" value="اسحاق شكر خضر">
<label>نەتەوە / جنسية</label><input id="nat" value="کورد - عێراقي">
<label>وڵات / دولة</label><input id="country" value="کوردستان - عێراق">
<label>ناوی هوتێل / اسم فندق</label><input id="hotel" value="ابراج الكسوة">
<label>ژمارەی مۆبایل / رقم جوال</label><input id="phone" value="009647508944085">
<label>وێنەی زائر</label><input class="file" id="photoFile" type="file" accept="image/*">
<label>لۆگۆی کۆمپانیا</label><input class="file" id="logoFile" type="file" accept="image/*">
<label>ئاڵای کوردستان</label><input class="file" id="flagFile" type="file" accept="image/*">
<div class="controls">
<button id="save">هەڵگرتن</button>
<button class="secondary" id="download">دابەزاندنی وێنە</button>
</div>
<p class="note">QR ـی WhatsApp سابتە. دیزاینی باجەکە لەسەر هەمان شێوەی نموونەکە دانراوە.</p>
</section>

<script>
const $=id=>document.getElementById(id);
const pairs=[["name","outName"],["nat","outNat"],["country","outCountry"],["hotel","outHotel"],["phone","outPhone"]];
function update(){pairs.forEach(([a,b])=>$(b).textContent=$(a).value||"—")}
pairs.forEach(([a])=>$(a).addEventListener("input",update));
function preview(input,img,ph){input.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$(img).src=r.result;$(img).style.display="block";$(ph).style.display="none"};r.readAsDataURL(f)})}
preview($("photoFile"),"person","ph");
preview($("logoFile"),"logo","logoPh");
preview($("flagFile"),"flag","flagPh");
$("save").onclick=()=>{const d={};pairs.forEach(([a])=>d[a]=$(a).value);localStorage.noorPass=JSON.stringify(d);alert("زانیارییەکان هەڵگیران")};
try{const d=JSON.parse(localStorage.noorPass||"null");if(d)pairs.forEach(([a])=>$(a).value=d[a]||$(a).value)}catch(e){}
update();

$("download").onclick=async()=>{
const btn=$("download");btn.disabled=true;btn.textContent="ئامادە دەکرێت...";
try{
const holder=document.createElement("div");holder.style.cssText="position:fixed;left:-10000px;top:0;width:1536px;height:1024px;overflow:hidden";
const clone=$("card").cloneNode(true);clone.style.cssText="position:relative;width:1536px;height:1024px;aspect-ratio:auto;left:0;top:0;margin:0;border-radius:25px;background-size:1536px 1024px";
holder.appendChild(clone);document.body.appendChild(holder);
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const canvas=await html2canvas(clone,{width:1536,height:1024,scale:2,useCORS:true,backgroundColor:"#f8f4ea",logging:false});
const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Noor-Ziyarat-Umrah-Pass.png";a.click();
setTimeout(()=>URL.revokeObjectURL(url),3000);holder.remove();
}catch(e){alert("دابەزاندن سەرکەوتوو نەبوو")}finally{btn.disabled=false;btn.textContent="دابەزاندنی وێنە"}
};
</script>
