const $=id=>document.getElementById(id);const pairs=[['name','outName'],['nat','outNat'],['country','outCountry'],['hotel','outHotel'],['phone','outPhone']];
function formatPhone(v){v=v.trim();if(!v)return '';let d=v.replace(/\D/g,'');if(d.startsWith('00964'))d=d.slice(5);else if(d.startsWith('964'))d=d.slice(3);else if(d.startsWith('0'))d=d.slice(1);if(d.length===10)return '00964 '+d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6);return v;}
function update(){pairs.forEach(([a,b])=>$(b).textContent=a==='phone'?formatPhone($(a).value):($(a).value||''));}
pairs.forEach(([a])=>$(a).addEventListener('input',update));update();
$('photoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('person').src=r.result;$('person').style.display='block'};r.readAsDataURL(f)});
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
$('download').addEventListener('click',async()=>{const btn=$('download');btn.disabled=true;btn.textContent='چاوەڕێ بکە...';try{const bg=await loadImg(document.querySelector('.base').src);const canvas=document.createElement('canvas');canvas.width=1536;canvas.height=1024;const ctx=canvas.getContext('2d');ctx.drawImage(bg,0,0,1536,1024);if($('person').style.display!=='none'&&$('person').src){const p=await loadImg($('person').src);ctx.save();ctx.beginPath();ctx.roundRect(46,324,359,500,18);ctx.clip();const s=Math.max(359/p.width,500/p.height),w=p.width*s,h=p.height*s;ctx.drawImage(p,46+(359-w)/2,324+(500-h)/2,w,h);ctx.restore();ctx.strokeStyle='#b68a2f';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(46,324,359,500,18);ctx.stroke();}
ctx.fillStyle='#101820';ctx.textAlign='right';ctx.textBaseline='middle';ctx.font='800 29px "Geeza Pro",Arial,sans-serif';[['name',1220,326],['nat',1220,430],['country',1220,537],['hotel',1220,647]].forEach(([id,x,y])=>ctx.fillText($(id).value||'',x,y));ctx.direction='ltr';ctx.font='800 27px Arial,sans-serif';ctx.fillText(formatPhone($('phone').value),1220,756);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const file=new File([blob],'Noor-Ziyarat-Umrah-Pass.png',{type:'image/png'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Noor Ziyarat Umrah Pass'});else{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}}catch(e){if(e.name!=='AbortError')alert('دابەزاندن سەرکەوتوو نەبوو')}finally{btn.disabled=false;btn.textContent='دابەزاندنی وێنە'}});
